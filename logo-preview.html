<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 60px;
  }
  .label {
    color: #555;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
    text-align: center;
    font-family: sans-serif;
  }
  .variant { text-align: center; }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
    font-weight: 900;
    font-size: 52px;
    letter-spacing: -1px;
    color: white;
    line-height: 1;
  }
  .logo .dot {
    width: 12px;
    height: 12px;
    background: #c1121f;
    border-radius: 50%;
    flex-shrink: 0;
    align-self: flex-end;
    margin-bottom: 6px;
  }
  .logo.on-white {
    color: #0a0a0a;
  }
</style>
</head>
<body>

<div class="variant">
  <div class="label">Na tamnoj pozadini</div>
  <div class="logo">
    <span>CO</span>
    <span class="dot"></span>
    <span>DIGIT</span>
  </div>
</div>

<div class="variant" style="background:#fff; padding: 36px 56px; border-radius: 8px;">
  <div class="label" style="color:#aaa;">Na bijeloj pozadini</div>
  <div class="logo on-white">
    <span>CO</span>
    <span class="dot"></span>
    <span>DIGIT</span>
  </div>
</div>

</body>
</html>
