# Netlify configuration for codigit.io
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Static site, no build command needed
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.images]
  compress = true

# Ignore .claude worktrees and dev folders from deploy
[build.environment]
  NODE_VERSION = "20"

# Pre-deploy ignore patterns (Netlify deploy excludes these)
# Reference for what NOT to deploy
# Netlify automatically excludes: .git, node_modules, .netlify

# Headers for HTTPS-only (Netlify auto-redirects HTTP→HTTPS but explicit)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(self 'https://buy.stripe.com' 'https://checkout.stripe.com')"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://api.web3forms.com; frame-src https://buy.stripe.com https://checkout.stripe.com; form-action 'self'; upgrade-insecure-requests"
    X-XSS-Protection = "1; mode=block"

# Cache static assets aggressively
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

# HTML — short cache for fresh content
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Force HTTPS + non-www (Netlify also handles this in domain settings)
[[redirects]]
  from = "http://codigit.io/*"
  to = "https://codigit.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.codigit.io/*"
  to = "https://codigit.io/:splat"
  status = 301
  force = true

# Canonical: /index.html → /
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Old WordPress URL structures → home
[[redirects]]
  from = "/category/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/tag/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/author/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/portfolio"
  to = "/"
  status = 301

[[redirects]]
  from = "/portfolio/*"
  to = "/"
  status = 301

# Old blog URLs → new blog
[[redirects]]
  from = "/blog/the-impact-of-ai-on-web-development-trends-to-watch-in-2025/"
  to = "/blog/how-ai-is-changing-web-development.html"
  status = 301

[[redirects]]
  from = "/blog/the-impact-of-ai-on-web-development-trends-to-watch-in-2025"
  to = "/blog/how-ai-is-changing-web-development.html"
  status = 301

[[redirects]]
  from = "/blog/pwas-vs-native"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/pwas-vs-native/"
  to = "/blog/"
  status = 301

# Renamed apps
[[redirects]]
  from = "/apps/sleep-toggle.html"
  to = "/apps/stayawake.html"
  status = 301

[[redirects]]
  from = "/apps/dock-lock.html"
  to = "/apps/dockguard.html"
  status = 301

# Block hacked PHP spam URLs (410 Gone — tells Google to remove from index)
# Allow only webhook.php and contact.php (if they exist on Netlify, otherwise irrelevant)
[[redirects]]
  from = "/ammika.php"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/ammika.php/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/saiga.php"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/saiga.php/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-content/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-admin/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/wp-includes/*"
  to = "/410.html"
  status = 410
  force = true
